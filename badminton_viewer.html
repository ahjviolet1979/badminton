<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>배드민턴 대진표</title>
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; font-family: "Segoe UI", "Malgun Gothic", Arial, sans-serif; background: #edf6ef; color: #10231c; }
    .card { width: min(420px, calc(100vw - 32px)); background: #fff; border: 1px solid #d9e5dc; border-radius: 14px; padding: 24px; text-align: center; box-shadow: 0 12px 28px rgba(15, 54, 38, 0.08); }
    h1 { margin: 0 0 10px; font-size: 24px; }
    p { margin: 0 0 18px; color: #617169; line-height: 1.5; }
    a { display: inline-flex; align-items: center; justify-content: center; min-height: 44px; padding: 0 18px; border-radius: 10px; background: #087f5b; color: #fff; font-weight: 800; text-decoration: none; }
  </style>
</head>
<body>
  <main class="card">
    <h1>모바일 사용자 화면으로 이동합니다</h1>
    <p>사용자 화면은 모바일 버전으로 통합되었습니다.</p>
    <a href="m.html">모바일 화면 열기</a>
  </main>
  <script>
    window.setTimeout(() => {
      window.location.href = "m.html";
    }, 800);
  </script>
</body>
</html>
