<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>諛곕뱶誘쇳꽩 紐⑤컮??蹂닿린</title>
  <script src="supabase_config.js"></script>
  <style>
    :root {
      --bg: #f5f8f3;
      --panel: #ffffff;
      --ink: #122019;
      --muted: #64746b;
      --line: #dce5dd;
      --accent: #047857;
      --accent-soft: #e9f8f1;
      --blue: #2563eb;
      --pink: #be185d;
      --warn: #b45309;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Segoe UI", "Malgun Gothic", Arial, sans-serif;
      background: var(--bg);
      color: var(--ink);
    }

    body.locked .app { display: none; }
    body:not(.locked) .login-screen { display: none; }

    button, input, select { font: inherit; }

    .login-screen {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 18px;
    }

    .login-card, .section, .match-card, .player-card {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 10px;
      box-shadow: 0 8px 24px rgba(18, 32, 25, 0.06);
    }

    .login-card {
      width: min(430px, 100%);
      padding: 20px;
    }

    h1 {
      margin: 0;
      font-size: 24px;
      line-height: 1.2;
    }

    .sub {
      margin: 8px 0 16px;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.45;
    }

    label {
      display: block;
      margin: 12px 0 7px;
      font-size: 13px;
      font-weight: 800;
    }

    input, select {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 11px;
      background: #fbfcfa;
      color: var(--ink);
    }

    .btn {
      border: 0;
      border-radius: 8px;
      min-height: 42px;
      padding: 0 13px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      cursor: pointer;
      background: var(--accent);
      color: #fff;
      font-weight: 900;
    }

    .btn.full { width: 100%; margin-top: 14px; }

    .icon-btn {
      width: 38px;
      height: 38px;
      border: 0;
      border-radius: 8px;
      display: grid;
      place-items: center;
      background: var(--accent);
      color: #fff;
      cursor: pointer;
    }

    .icon-btn svg {
      width: 18px;
      height: 18px;
      stroke-width: 2.2;
    }

    .error {
      min-height: 20px;
      margin-top: 10px;
      color: #b91c1c;
      font-size: 13px;
      font-weight: 800;
    }

    .app {
      width: min(720px, 100%);
      margin: 0 auto;
      padding: 14px;
    }

    header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 12px;
    }

    .tools {
      display: flex;
      gap: 7px;
      flex: 0 0 auto;
    }

    .chips {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 6px;
      margin: 12px 0;
    }

    .chip {
      background: var(--panel);
      border: 1px solid var(--line);
      border-top-width: 4px;
      border-radius: 8px;
      padding: 8px 6px;
      min-height: 48px;
    }

    .chip:nth-child(1) { border-top-color: #86efac; }
    .chip:nth-child(2) { border-top-color: #93c5fd; }
    .chip:nth-child(3) { border-top-color: #fcd34d; }
    .chip:nth-child(4) { border-top-color: #f9a8d4; }
    .chip:nth-child(5) { border-top-color: #a7f3d0; }

    .chip b {
      display: block;
      font-size: 17px;
      line-height: 1.1;
      white-space: nowrap;
    }

    .chip span {
      display: block;
      margin-top: 4px;
      color: var(--muted);
      font-size: 10px;
      font-weight: 900;
      white-space: nowrap;
    }

    .player-search {
      margin: 8px 0 6px;
    }

    .player-search input {
      width: 100%;
      min-height: 36px;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 8px 11px;
      background: rgba(255, 255, 255, 0.86);
      color: var(--ink);
      font-size: 14px;
    }

    .player-search input::placeholder {
      color: #8a9a91;
    }

    .tabs {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
      margin: 12px 0;
      position: sticky;
      top: 0;
      z-index: 2;
      background: var(--bg);
      padding: 4px 0;
    }

    .tab {
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
      min-height: 40px;
      font-weight: 900;
      color: var(--muted);
    }

    .tab.active {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent);
    }

    .view { display: none; }
    .view.active { display: block; }

    .section {
      padding: 12px;
      margin-bottom: 10px;
    }

    .section-title {
      margin: 0 0 10px;
      font-size: 16px;
      font-weight: 900;
    }

    .match-list, .player-list {
      display: grid;
      gap: 9px;
    }

    .match-card {
      padding: 8px;
      overflow: hidden;
    }

    .player-card {
      padding: 0;
      overflow: hidden;
    }

    .player-head {
      display: grid;
      grid-template-columns: 88px 1fr;
      align-items: center;
      background: #fff8f3;
      border-bottom: 1px solid #eee5df;
    }

    .player-name {
      min-height: 34px;
      display: grid;
      align-content: center;
      padding: 7px 9px;
      background: #f8fbf3;
      color: #17231d;
      font-size: 18px;
      font-weight: 900;
    }

    .event-fine {
      display: block;
      margin-top: 3px;
      color: #b45309;
      font-size: 11px;
      font-weight: 900;
      white-space: nowrap;
    }

    .player-record {
      padding: 7px 9px;
      color: #56645d;
      font-size: 13px;
      font-weight: 500;
      line-height: 1.45;
    }

    .player-record-line {
      display: block;
      white-space: nowrap;
    }

    .player-block {
      padding: 7px 9px 8px;
      border-bottom: 1px solid rgba(18, 32, 25, 0.08);
    }

    .player-block.partner {
      background: #f7fbff;
    }

    .player-block.rest {
      background: #fffbee;
      border-bottom: 0;
    }

    .player-block-title {
      margin-bottom: 5px;
      color: #3f4e46;
      font-size: 13px;
      font-weight: 600;
    }

    .match-line {
      display: grid;
      grid-template-columns: 68px minmax(0, 1fr) 16px minmax(0, 1fr);
      gap: 4px;
      align-items: stretch;
    }

    .match-meta {
      display: grid;
      place-items: center;
      border-radius: 8px;
      color: #42534a;
      font-size: 12px;
      font-weight: 900;
      line-height: 1.25;
      text-align: center;
      background: #f4faf6;
    }

    .team-row {
      border: 1px solid transparent;
      border-radius: 8px;
      padding: 7px 6px;
      position: relative;
      display: grid;
      grid-template-columns: auto minmax(0, 1fr);
      gap: 4px;
      align-items: center;
      min-width: 0;
      background: #fbfcfa;
    }

    .team-row.win-a {
      background: #eef6ff;
      border-color: #bfdbfe;
    }

    .team-row.win-b {
      background: #fff1f7;
      border-color: #fbcfe8;
    }

    .team-row:has(.win-mark),
    .team-row:has(.done-mark) {
      padding-right: 38px;
    }

    .match-card.next-match {
      background: #f0fdf4;
      border-color: #bbf7d0;
      box-shadow: inset 4px 0 0 #10b981, 0 8px 24px rgba(18, 32, 25, 0.06);
    }

    .team-label {
      flex: 0 0 auto;
      color: var(--muted);
      font-size: 12px;
      font-weight: 900;
    }

    .names {
      min-width: 0;
      font-size: 16px;
      font-weight: 900;
      line-height: 1.2;
      display: grid;
      gap: 2px;
    }

    .player-name-line {
      min-width: 0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .win-mark {
      flex: 0 0 auto;
      position: absolute;
      right: 6px;
      top: 50%;
      transform: translateY(-50%);
      min-width: 24px;
      min-height: 21px;
      display: inline-grid;
      place-items: center;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 900;
      color: #fff;
    }

    .match-vs {
      display: grid;
      place-items: center;
      color: #6b5d38;
      font-size: 11px;
      font-weight: 900;
    }

    .win-mark.a { background: #2563eb; }
    .win-mark.b { background: #be185d; }

    .done-mark {
      flex: 0 0 auto;
      position: absolute;
      right: 6px;
      top: 50%;
      transform: translateY(-50%);
      display: inline-grid;
      place-items: center;
      min-height: 21px;
      padding: 0 8px;
      border-radius: 999px;
      background: #e5e7eb;
      color: #475569;
      font-size: 12px;
      font-weight: 900;
    }

    .progress-mark {
      background: #fef3c7;
      color: #92400e;
    }

    .next-badge {
      display: inline-flex;
      align-items: center;
      padding: 2px 7px;
      border-radius: 999px;
      background: #dcfce7;
      color: #047857;
      font-size: 11px;
      font-weight: 900;
      white-space: nowrap;
    }

    .event-dot {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 17px;
      height: 17px;
      margin: 0 3px 0 0;
      border-radius: 999px;
      background: #fff7ed;
      color: #c2410c;
      border: 1px solid #fdba74;
      font-size: 10px;
      font-weight: 900;
      line-height: 1;
    }

    .rank-list {
      display: grid;
      gap: 8px;
    }

    .rank-section {
      display: grid;
      gap: 8px;
      margin-bottom: 12px;
    }

    .rank-section-title {
      padding: 7px 9px;
      border: 1px solid #cfe3d7;
      border-radius: 8px;
      background: #f4faf6;
      color: #315243;
      font-size: 13px;
      font-weight: 900;
    }

    .rank-row {
      display: grid;
      grid-template-columns: 28px 1fr;
      gap: 8px;
      align-items: center;
      padding: 8px 9px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
    }

    .rank-main {
      display: block;
      min-width: 0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .rank-no {
      color: var(--accent);
      font-weight: 900;
      text-align: center;
    }

    .rank-name {
      font-size: 14px;
      font-weight: 900;
      margin-right: 6px;
    }

    .rank-sub, .rank-rate {
      color: var(--muted);
      font-size: 12px;
      font-weight: 800;
      white-space: nowrap;
    }

    .rank-row.top-1 {
      background: #fff7dc;
      border-color: #f2d685;
      box-shadow: inset 4px 0 0 #f1c94b;
    }

    .rank-row.top-2 {
      background: #f1f5f9;
      border-color: #cbd5e1;
      box-shadow: inset 4px 0 0 #b8c5d6;
    }

    .rank-row.top-3 {
      background: #fff0e5;
      border-color: #fdba74;
      box-shadow: inset 4px 0 0 #f0a36b;
    }

    .rank-row.top-1 .rank-no { color: #b45309; }
    .rank-row.top-2 .rank-no { color: #475569; }
    .rank-row.top-3 .rank-no { color: #c2410c; }

    .player-picker {
      margin-bottom: 10px;
    }

    .mini-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
      margin-bottom: 10px;
    }

    .mini {
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 8px;
      background: #fbfcfa;
    }

    .mini b {
      display: block;
      font-size: 16px;
    }

    .mini span {
      display: block;
      color: var(--muted);
      font-size: 10px;
      font-weight: 900;
      margin-top: 4px;
    }

    .line-list {
      margin: 0;
      padding-left: 10px;
      list-style: none;
      line-height: 1.65;
      color: #53625b;
      font-size: 14px;
      font-weight: 400;
    }

    .line-list li::before {
      content: "- ";
    }

    .empty {
      border: 1px dashed var(--line);
      border-radius: 8px;
      padding: 24px;
      text-align: center;
      color: var(--muted);
      background: #fbfcfa;
      line-height: 1.5;
    }
  </style>
</head>
<body class="locked">
  <div class="login-screen">
    <form class="login-card" id="loginForm">
      <h1>배드민턴 대진표</h1>
      <p>대회를 선택하고 비밀번호를 입력하세요.</p>
      <label for="eventSelect">대회 선택</label>
      <select id="eventSelect">
        <option value="">대회 목록을 불러오는 중입니다</option>
      </select>
      <label for="password">비밀번호</label>
      <input id="password" type="password" autocomplete="current-password">
      <button class="btn full" type="submit">입장</button>
      <div class="error" id="loginError"></div>
    </form>
  </div>

  <main class="app">
    <header>
      <div>
        <h1 id="eventTitle">배드민턴 대진표</h1>
        <p class="sub" id="statusText">대회 데이터를 불러오는 중입니다.</p>
      </div>
      <div class="tools">
        <button class="icon-btn" id="reloadBtn" type="button" title="새로고침" aria-label="새로고침">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg>
        </button>
        <button class="icon-btn" id="logoutBtn" type="button" title="로그아웃" aria-label="로그아웃">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M10 17l5-5-5-5"/><path d="M15 12H3"/><path d="M21 3v18"/></svg>
        </button>
      </div>
    </header>

    <div class="chips">
      <div class="chip"><b id="playerCount">0</b><span>선수</span></div>
      <div class="chip"><b id="matchCount">0</b><span>경기</span></div>
      <div class="chip"><b id="roundCount">0</b><span>라운드</span></div>
      <div class="chip"><b id="completeCount">0</b><span>결과</span></div>
      <div class="chip"><b id="winnerCount">A 0 / B 0</b><span>승리팀</span></div>
    </div>

    <div class="player-search">
      <input id="playerSearch" type="search" placeholder="선수 이름 검색" autocomplete="off">
    </div>

    <div class="tabs">
      <button class="tab active" data-view="scheduleView" type="button">대진표</button>
      <button class="tab" data-view="playersView" type="button">게임이력</button>
      <button class="tab" data-view="rankingView" type="button">순위</button>
    </div>

    <section class="view active" id="scheduleView">
      <div id="scheduleOutput" class="empty">대진 데이터를 기다리고 있습니다.</div>
    </section>

    <section class="view" id="playersView">
      <div id="playersOutput" class="empty">게임이력 데이터를 기다리고 있습니다.</div>
    </section>

    <section class="view" id="rankingView">
      <div id="rankingOutput" class="empty">순위 데이터를 기다리고 있습니다.</div>
    </section>
  </main>

  <script>
    const state = { players: [], schedule: [], results: {}, updatedAt: "", teamMap: {}, teamMode: false, eventName: "", nextMatchIds: [], eventFineAmount: 0, schedulePublic: true };
    const el = id => document.getElementById(id);
    let supabaseClient = null;
    let realtimeChannel = null;
    let autoRefreshTimer = null;

    function escapeHtml(value) {
      return String(value ?? "").replace(/[&<>"]/g, char => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[char]));
    }

    function startAutoRefresh() {
      if (autoRefreshTimer) window.clearInterval(autoRefreshTimer);
      autoRefreshTimer = window.setInterval(() => {
        if (document.body.classList.contains("locked")) return;
        loadData();
      }, 5 * 60 * 1000);
    }

    function config() {
      const globalConfig = window.BADMINTON_SUPABASE || {};
      return {
        url: globalConfig.url || "",
        anonKey: globalConfig.anonKey || "",
        eventId: sessionStorage.getItem("badminton_mobile_event_id") || globalConfig.eventId || "main"
      };
    }

    async function client() {
      const cfg = config();
      if (!cfg.url || !cfg.anonKey) throw new Error("Supabase 설정이 비어 있습니다.");
      if (!supabaseClient) {
        const { createClient } = await import("https://esm.sh/@supabase/supabase-js@2");
        supabaseClient = createClient(cfg.url, cfg.anonKey);
      }
      return supabaseClient;
    }

    async function loadEvents() {
      try {
        const sb = await client();
        const { data, error } = await sb
          .from("badminton_events")
          .select("id, data, updated_at")
          .order("updated_at", { ascending: false });
        if (error) throw error;
        const events = (data || []).filter(row => row.data?.ended !== true && row.data?.viewerPassword);
        el("eventSelect").innerHTML = events.length
          ? events.map(row => `<option value="${escapeHtml(row.id)}">${escapeHtml(row.data?.eventId || row.id)}</option>`).join("")
          : `<option value="">진행 중인 대회가 없습니다</option>`;
      } catch (error) {
        el("eventSelect").innerHTML = `<option value="">대회 목록 불러오기 실패</option>`;
        el("loginError").textContent = error.message;
      }
    }

    async function fetchEvent(eventId) {
      const sb = await client();
      const { data, error } = await sb
        .from("badminton_events")
        .select("data, updated_at")
        .eq("id", eventId)
        .single();
      if (error) throw new Error("대회 데이터를 찾을 수 없습니다.");
      return { ...data.data, updatedAt: data.data?.updatedAt || data.updated_at };
    }

    async function login(event) {
      event.preventDefault();
      const eventId = el("eventSelect").value;
      const password = el("password").value.trim();
      if (!eventId || !password) {
        el("loginError").textContent = "대회와 비밀번호를 입력하세요.";
        return;
      }
      try {
        const data = await fetchEvent(eventId);
        if (data.ended) throw new Error("종료된 대회입니다.");
        if (password !== data.viewerPassword) throw new Error("비밀번호가 맞지 않습니다.");
        sessionStorage.setItem("badminton_mobile_ok", "1");
        sessionStorage.setItem("badminton_mobile_event_id", eventId);
        sessionStorage.setItem("badminton_mobile_password", password);
        document.body.classList.remove("locked");
        applyData(data);
        subscribe();
        startAutoRefresh();
      } catch (error) {
        el("loginError").textContent = error.message;
      }
    }

    function resultText(result) {
      if (result === "A") return "A팀 승";
      if (result === "B") return "B팀 승";
      if (result === "D") return "완료";
      if (result === "P") return "게임중";
      return "미입력";
    }

    function isSchedulePublic(data) {
      return data.schedulePublic !== false && data.publicSchedule !== false;
    }

    function applyData(data) {
      if (data.ended) {
        logout();
        return;
      }
      state.schedulePublic = isSchedulePublic(data);
      if (!state.schedulePublic) {
        state.players = [];
        state.schedule = [];
        state.results = {};
        state.nextMatchIds = [];
        state.updatedAt = data.updatedAt || "";
        state.eventName = data.eventId || sessionStorage.getItem("badminton_mobile_event_id") || "";
        renderAll();
        return;
      }
      state.players = Array.isArray(data.players) ? data.players : [];
      state.schedule = Array.isArray(data.schedule) ? data.schedule : [];
      state.results = data.results || {};
      state.teamMap = data.teamMap || {};
      state.teamMode = data.teamMode === "blueWhite";
      state.nextMatchIds = Array.isArray(data.nextMatchIds) ? data.nextMatchIds.map(Number).filter(Boolean) : [];
      state.eventFineAmount = Number(data.scheduleSettings?.eventFineAmount ?? data.eventFineAmount ?? 0);
      state.updatedAt = data.updatedAt || "";
      state.eventName = data.eventId || sessionStorage.getItem("badminton_mobile_event_id") || "";
      renderAll();
    }

    function statsForPlayers() {
      const eventFineAmount = Number(state.eventFineAmount || 0);
      const stats = new Map(state.players.map(name => [name, {
        name, games: 0, wins: 0, losses: 0, eventLosses: 0, eventFine: 0, done: 0, pending: 0, partners: new Map(), matches: [], team: state.teamMap[name] || ""
      }]));
      for (const match of state.schedule) {
        const result = state.results[match.id] || "";
        const teams = [
          { code: "A", label: (match.teamALabel || "A") + "팀", team: match.teamALabel === "청" ? "blue" : match.teamALabel === "백" ? "white" : "", players: match.teamA || [], opponents: match.teamB || [] },
          { code: "B", label: (match.teamBLabel || "B") + "팀", team: match.teamBLabel === "청" ? "blue" : match.teamBLabel === "백" ? "white" : "", players: match.teamB || [], opponents: match.teamA || [] }
        ];
        for (const team of teams) {
          const status = !result ? "미입력" : result === "P" ? "게임중" : result === "D" ? "완료" : result === team.code ? "승" : "패";
          for (const player of team.players) {
            if (!stats.has(player)) {
              stats.set(player, { name: player, games: 0, wins: 0, losses: 0, eventLosses: 0, eventFine: 0, done: 0, pending: 0, partners: new Map(), matches: [], team: team.team });
            }
            const partner = team.players.find(name => name !== player) || "";
            const row = stats.get(player);
            if (team.team && !row.team) row.team = team.team;
            row.games++;
            if (match.eventGame && ["A", "B"].includes(result) && result !== team.code) {
              row.eventLosses++;
              row.eventFine = row.eventLosses * eventFineAmount;
            }
            if (status === "승") row.wins++;
            if (status === "패") row.losses++;
            if (status === "완료") row.done++;
            if (status === "미입력") row.pending++;
            row.partners.set(partner, (row.partners.get(partner) || 0) + 1);
            row.matches.push({
              id: match.id,
              round: match.round,
              court: match.court,
              partner,
              opponents: team.opponents.join(" / "),
              status
            });
          }
        }
      }
      return [...stats.values()].sort((a, b) => a.name.localeCompare(b.name, "ko-KR"));
    }

    function partnerDetailLines(row) {
      return row.matches.length ? [...row.matches]
        .sort((a, b) => a.id - b.id)
        .map((match, index, matches) => {
          const next = matches[index + 1];
          const restText = next ? ", " + (next.id - match.id - 1) + "게임쉼" : "";
          return match.id + "경기 " + match.round + "R/" + match.court + "코트: 팀 " + match.partner + ", vs " + match.opponents + ", " + match.status + restText;
        })
        : ["경기별 이력 없음"];
    }

    function renderStats() {
      el("playerCount").textContent = state.players.length;
      el("matchCount").textContent = state.schedule.length;
      el("roundCount").textContent = state.schedule.length ? Math.max(...state.schedule.map(m => m.round || 0)) : 0;
      el("completeCount").textContent = Object.values(state.results).filter(value => ["A", "B", "D"].includes(value)).length;
      const aWins = Object.values(state.results).filter(value => value === "A").length;
      const bWins = Object.values(state.results).filter(value => value === "B").length;
      const blueWhite = state.schedule.some(match => match.mode === "blueWhite");
      el("winnerCount").textContent = blueWhite ? "청 " + aWins + " / 백 " + bWins : "A " + aWins + " / B " + bWins;
      const updated = state.updatedAt ? new Date(state.updatedAt).toLocaleString("ko-KR") : "기록 없음";
      el("eventTitle").textContent = state.eventName ? state.eventName + " 대진표" : "배드민턴 대진표";
      el("statusText").textContent = "마지막 업데이트: " + updated;
    }

    function searchText() {
      return (el("playerSearch")?.value || "").trim().toLowerCase();
    }

    function renderSchedule() {
      if (state.schedulePublic === false) {
        el("scheduleOutput").className = "empty";
        el("scheduleOutput").textContent = "관리자가 아직 대진을 공개하지 않았습니다.";
        return;
      }
      if (!state.schedule.length) {
        el("scheduleOutput").className = "empty";
        el("scheduleOutput").textContent = "대진 데이터가 아직 없습니다.";
        return;
      }
      const search = searchText();
      const schedule = search
        ? state.schedule.filter(match => [...(match.teamA || []), ...(match.teamB || [])].some(name => String(name).toLowerCase().includes(search)))
        : state.schedule;
      if (!schedule.length) {
        el("scheduleOutput").className = "empty";
        el("scheduleOutput").textContent = "검색된 선수의 대진이 없습니다.";
        return;
      }
      el("scheduleOutput").className = "match-list";
      el("scheduleOutput").innerHTML = schedule.map(match => {
        const result = state.results[match.id] || "";
        const isNext = (state.nextMatchIds || []).map(Number).includes(Number(match.id));
        const teamAPlayers = `<span class="player-name-line">${escapeHtml(match.teamA?.[0] || "")}</span><span class="player-name-line">${escapeHtml(match.teamA?.[1] || "")}</span>`;
        const teamBPlayers = `<span class="player-name-line">${escapeHtml(match.teamB?.[0] || "")}</span><span class="player-name-line">${escapeHtml(match.teamB?.[1] || "")}</span>`;
        return `<article class="match-card ${isNext ? "next-match" : ""}">
          <div class="match-line">
            <div class="match-meta">${match.eventGame ? '<span class="event-dot" title="이벤트 경기">E</span>' : ''}${match.id}경기<br>${match.round}R/${match.court}코트${isNext ? '<br><span class="next-badge">다음</span>' : ''}</div>
            <div class="team-row ${result === "A" ? "win-a" : ""}"><span class="team-label">${escapeHtml(match.teamALabel || "A")}팀</span><span class="names">${teamAPlayers}</span>${result === "A" ? '<span class="win-mark a">승</span>' : ''}</div>
            <div class="match-vs">vs</div>
            <div class="team-row ${result === "B" ? "win-b" : ""}"><span class="team-label">${escapeHtml(match.teamBLabel || "B")}팀</span><span class="names">${teamBPlayers}</span>${result === "B" ? '<span class="win-mark b">승</span>' : ''}${result === "D" ? '<span class="done-mark">완료</span>' : ''}${result === "P" ? '<span class="done-mark progress-mark">게임중</span>' : ''}</div>
          </div></article>`;
      }).join("");
    }

    function playerCard(row) {
      return `<article class="player-card">
        <div class="player-head">
          <div class="player-name">${escapeHtml(row.name)}${row.eventLosses ? `<span class="event-fine">E ${row.eventLosses}패 ${Number(row.eventFine || 0).toLocaleString("ko-KR")}원</span>` : ""}</div>
          <div class="player-record"><span class="player-record-line">총 ${row.games}경기 / 미입력 ${row.pending}</span><span class="player-record-line">승 ${row.wins} / 패 ${row.losses} / 완료 ${row.done}</span></div>
        </div>
        <div class="player-block partner">
          <ul class="line-list">${partnerDetailLines(row).map(line => `<li>${escapeHtml(line)}</li>`).join("")}</ul>
        </div>
      </article>`;
    }

    function renderPlayers(stats) {
      if (state.schedulePublic === false) {
        el("playersOutput").className = "empty";
        el("playersOutput").textContent = "관리자가 아직 게임이력을 공개하지 않았습니다.";
        return;
      }
      const search = searchText();
      const visibleStats = search ? stats.filter(row => row.name.toLowerCase().includes(search)) : stats;
      if (!stats.length) {
        el("playersOutput").className = "empty";
        el("playersOutput").textContent = "선수 데이터가 아직 없습니다.";
        return;
      }
      if (!visibleStats.length) {
        el("playersOutput").className = "empty";
        el("playersOutput").textContent = "검색된 선수의 게임이력이 없습니다.";
        return;
      }
      el("playersOutput").className = "player-list";
      el("playersOutput").innerHTML = visibleStats.map(playerCard).join("");
    }

    function renderRanking(stats) {
      if (state.schedulePublic === false) {
        el("rankingOutput").className = "empty";
        el("rankingOutput").textContent = "관리자가 아직 순위를 공개하지 않았습니다.";
        return;
      }
      if (!stats.length) {
        el("rankingOutput").className = "empty";
        el("rankingOutput").textContent = "순위 데이터가 아직 없습니다.";
        return;
      }
      const ranked = [...stats].sort((a, b) =>
        b.wins - a.wins ||
        (b.wins / Math.max(1, b.wins + b.losses + b.done)) - (a.wins / Math.max(1, a.wins + a.losses + a.done)) ||
        b.games - a.games ||
        b.partners.size - a.partners.size ||
        a.name.localeCompare(b.name, "ko-KR")
      );
      const search = searchText();
      const visibleRanked = search ? ranked.filter(row => row.name.toLowerCase().includes(search)) : ranked;
      if (!visibleRanked.length) {
        el("rankingOutput").className = "empty";
        el("rankingOutput").textContent = "검색된 선수의 순위가 없습니다.";
        return;
      }
      const renderRows = (rows, baseRows = ranked) => rows.map(row => {
        const index = baseRows.findIndex(item => item.name === row.name);
        const rankedGames = row.wins + row.losses + row.done;
        const winRate = rankedGames ? Math.round((row.wins / rankedGames) * 100) : 0;
        const eventText = row.eventLosses ? ` · E ${row.eventLosses}패 ${Number(row.eventFine || 0).toLocaleString("ko-KR")}원` : "";
        return `<div class="rank-row top-${index + 1}">
          <div class="rank-no">${index + 1}</div>
          <div class="rank-main"><span class="rank-name">${escapeHtml(row.name)}</span><span class="rank-sub">${row.games}경기 · 승 ${row.wins} · 패 ${row.losses} · 완료 ${row.done} · 파트너 ${row.partners.size} · 승률 ${winRate}%${eventText}</span></div>
        </div>`;
      }).join("");
      const blueWhite = state.schedule.some(match => match.mode === "blueWhite");
      el("rankingOutput").className = "rank-list";
      if (blueWhite) {
        const blueRows = ranked.filter(row => row.team === "blue");
        const whiteRows = ranked.filter(row => row.team === "white");
        const visibleBlueRows = search ? blueRows.filter(row => row.name.toLowerCase().includes(search)) : blueRows;
        const visibleWhiteRows = search ? whiteRows.filter(row => row.name.toLowerCase().includes(search)) : whiteRows;
        el("rankingOutput").innerHTML =
          `<section class="rank-section"><div class="rank-section-title">전체 순위</div>${renderRows(visibleRanked, ranked)}</section>` +
          `<section class="rank-section"><div class="rank-section-title">청팀 순위 (${blueRows.length}명)</div>${renderRows(visibleBlueRows, blueRows)}</section>` +
          `<section class="rank-section"><div class="rank-section-title">백팀 순위 (${whiteRows.length}명)</div>${renderRows(visibleWhiteRows, whiteRows)}</section>`;
        return;
      }
      el("rankingOutput").innerHTML = renderRows(visibleRanked, ranked);
    }

    function renderAll() {
      const stats = statsForPlayers();
      renderStats();
      renderSchedule();
      renderPlayers(stats);
      renderRanking(stats);
    }

    async function loadData() {
      const eventId = sessionStorage.getItem("badminton_mobile_event_id");
      if (!eventId) return;
      try {
        const data = await fetchEvent(eventId);
        const password = sessionStorage.getItem("badminton_mobile_password") || "";
        if (data.viewerPassword !== password) throw new Error("비밀번호가 변경되었습니다.");
        applyData(data);
      } catch (error) {
        logout();
      }
    }

    async function subscribe() {
      const eventId = sessionStorage.getItem("badminton_mobile_event_id");
      if (!eventId) return;
      const sb = await client();
      if (realtimeChannel) sb.removeChannel(realtimeChannel);
      realtimeChannel = sb.channel(`badminton-mobile-${eventId}`)
        .on("postgres_changes", { event: "*", schema: "public", table: "badminton_events", filter: `id=eq.${eventId}` }, payload => {
          if (payload.new?.data) applyData({ ...payload.new.data, updatedAt: payload.new.data?.updatedAt || payload.new.updated_at });
          if (payload.eventType === "DELETE") logout();
        })
        .subscribe();
    }

    function logout() {
      sessionStorage.removeItem("badminton_mobile_ok");
      sessionStorage.removeItem("badminton_mobile_password");
      document.body.classList.add("locked");
      el("password").value = "";
      loadEvents();
    }

    document.querySelectorAll(".tab").forEach(tab => {
      tab.addEventListener("click", () => {
        document.querySelectorAll(".tab").forEach(item => item.classList.remove("active"));
        document.querySelectorAll(".view").forEach(view => view.classList.remove("active"));
        tab.classList.add("active");
        el(tab.dataset.view).classList.add("active");
      });
    });
    el("loginForm").addEventListener("submit", login);
    el("reloadBtn").addEventListener("click", loadData);
    el("logoutBtn").addEventListener("click", logout);
    el("playerSearch").addEventListener("input", renderAll);

    if (sessionStorage.getItem("badminton_mobile_ok") === "1") {
      document.body.classList.remove("locked");
      loadData();
      subscribe();
      startAutoRefresh();
    } else {
      loadEvents();
    }
  </script>
</body>
</html>
