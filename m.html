<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>배드민턴 모바일 보기</title>
  <script src="supabase_config.js"></script>
  <style>
    :root {
      --bg: #f5f8f3;
      --panel: #ffffff;
      --ink: #122019;
      --muted: #64746b;
      --line: #dce5dd;
      --accent: #047857;
      --accent-soft: #e9f8f1;
      --blue: #2563eb;
      --pink: #be185d;
      --warn: #b45309;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Segoe UI", "Malgun Gothic", Arial, sans-serif;
      background: var(--bg);
      color: var(--ink);
    }

    body.locked .app { display: none; }
    body:not(.locked) .login-screen { display: none; }

    button, input, select { font: inherit; }

    .login-screen {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 18px;
    }

    .login-card, .section, .match-card, .player-card {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 10px;
      box-shadow: 0 8px 24px rgba(18, 32, 25, 0.06);
    }

    .login-card {
      width: min(430px, 100%);
      padding: 20px;
    }

    h1 {
      margin: 0;
      font-size: 24px;
      line-height: 1.2;
    }

    .sub {
      margin: 8px 0 16px;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.45;
    }

    label {
      display: block;
      margin: 12px 0 7px;
      font-size: 13px;
      font-weight: 800;
    }

    input, select {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 11px;
      background: #fbfcfa;
      color: var(--ink);
    }

    .btn {
      border: 0;
      border-radius: 8px;
      min-height: 42px;
      padding: 0 13px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      cursor: pointer;
      background: var(--accent);
      color: #fff;
      font-weight: 900;
    }

    .btn.full { width: 100%; margin-top: 14px; }

    .icon-btn {
      width: 38px;
      height: 38px;
      border: 0;
      border-radius: 8px;
      display: grid;
      place-items: center;
      background: var(--accent);
      color: #fff;
      cursor: pointer;
    }

    .icon-btn svg {
      width: 18px;
      height: 18px;
      stroke-width: 2.2;
    }

    .error {
      min-height: 20px;
      margin-top: 10px;
      color: #b91c1c;
      font-size: 13px;
      font-weight: 800;
    }

    .app {
      width: min(720px, 100%);
      margin: 0 auto;
      padding: 14px;
    }

    header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 12px;
    }

    .tools {
      display: flex;
      gap: 7px;
      flex: 0 0 auto;
    }

    .chips {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 6px;
      margin: 12px 0;
    }

    .chip {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 8px 6px;
      min-height: 48px;
    }

    .chip b {
      display: block;
      font-size: 17px;
      line-height: 1.1;
      white-space: nowrap;
    }

    .chip span {
      display: block;
      margin-top: 4px;
      color: var(--muted);
      font-size: 10px;
      font-weight: 900;
      white-space: nowrap;
    }

    .tabs {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
      margin: 12px 0;
      position: sticky;
      top: 0;
      z-index: 2;
      background: var(--bg);
      padding: 4px 0;
    }

    .tab {
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
      min-height: 40px;
      font-weight: 900;
      color: var(--muted);
    }

    .tab.active {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent);
    }

    .view { display: none; }
    .view.active { display: block; }

    .section {
      padding: 12px;
      margin-bottom: 10px;
    }

    .section-title {
      margin: 0 0 10px;
      font-size: 16px;
      font-weight: 900;
    }

    .match-list, .player-list {
      display: grid;
      gap: 9px;
    }

    .match-card {
      padding: 12px;
    }

    .player-card {
      padding: 0;
      overflow: hidden;
    }

    .player-head {
      display: grid;
      grid-template-columns: 88px 1fr;
      align-items: center;
      background: #fff1e9;
      border-bottom: 1px solid #ead8cd;
    }

    .player-name {
      min-height: 34px;
      display: flex;
      align-items: center;
      padding: 7px 9px;
      background: #f1f8e9;
      font-size: 14px;
      font-weight: 900;
    }

    .player-record {
      padding: 7px 9px;
      font-size: 15px;
      font-weight: 900;
      white-space: nowrap;
    }

    .player-block {
      padding: 7px 9px 8px;
      border-bottom: 1px solid rgba(18, 32, 25, 0.08);
    }

    .player-block.partner {
      background: #edf7ff;
    }

    .player-block.rest {
      background: #fff7d9;
      border-bottom: 0;
    }

    .player-block-title {
      margin-bottom: 5px;
      font-size: 13px;
      font-weight: 900;
    }

    .match-head {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      align-items: center;
      margin-bottom: 10px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 900;
    }

    .teams {
      display: grid;
      gap: 8px;
    }

    .team-row {
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 9px;
      display: grid;
      grid-template-columns: 42px 1fr 28px;
      gap: 8px;
      align-items: center;
    }

    .team-row.win-a {
      background: #eef6ff;
      border-color: #bfdbfe;
    }

    .team-row.win-b {
      background: #fff1f7;
      border-color: #fbcfe8;
    }

    .team-label {
      color: var(--muted);
      font-size: 12px;
      font-weight: 900;
    }

    .names {
      font-size: 15px;
      font-weight: 900;
      line-height: 1.35;
      word-break: keep-all;
    }

    .win-mark {
      min-height: 24px;
      display: inline-grid;
      place-items: center;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 900;
      color: #fff;
    }

    .win-mark.a { background: #2563eb; }
    .win-mark.b { background: #be185d; }

    .rank-list {
      display: grid;
      gap: 8px;
    }

    .rank-row {
      display: grid;
      grid-template-columns: 28px 1fr;
      gap: 8px;
      align-items: center;
      padding: 8px 9px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
    }

    .rank-main {
      display: block;
      min-width: 0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .rank-no {
      color: var(--accent);
      font-weight: 900;
      text-align: center;
    }

    .rank-name {
      font-size: 14px;
      font-weight: 900;
      margin-right: 6px;
    }

    .rank-sub, .rank-rate {
      color: var(--muted);
      font-size: 12px;
      font-weight: 800;
      white-space: nowrap;
    }

    .rank-row.top-1 {
      background: #fff7dc;
      border-color: #f2d685;
    }

    .rank-row.top-2 {
      background: #f1f5f9;
      border-color: #cbd5e1;
    }

    .rank-row.top-3 {
      background: #fff0e5;
      border-color: #fdba74;
    }

    .player-picker {
      margin-bottom: 10px;
    }

    .mini-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
      margin-bottom: 10px;
    }

    .mini {
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 8px;
      background: #fbfcfa;
    }

    .mini b {
      display: block;
      font-size: 16px;
    }

    .mini span {
      display: block;
      color: var(--muted);
      font-size: 10px;
      font-weight: 900;
      margin-top: 4px;
    }

    .line-list {
      margin: 0;
      padding-left: 10px;
      list-style: none;
      line-height: 1.65;
      font-size: 14px;
      font-weight: 800;
    }

    .line-list li::before {
      content: "- ";
    }

    .empty {
      border: 1px dashed var(--line);
      border-radius: 8px;
      padding: 24px;
      text-align: center;
      color: var(--muted);
      background: #fbfcfa;
      line-height: 1.5;
    }
  </style>
</head>
<body class="locked">
  <div class="login-screen">
    <form class="login-card" id="loginForm">
      <h1>대회 입장</h1>
      <p class="sub">대회를 선택하고 안내받은 비밀번호를 입력하세요.</p>
      <label for="eventSelect">대회</label>
      <select id="eventSelect">
        <option value="">대회 목록을 불러오는 중입니다</option>
      </select>
      <label for="password">비밀번호</label>
      <input id="password" type="password" autocomplete="current-password">
      <button class="btn full" type="submit">입장</button>
      <div class="error" id="loginError"></div>
    </form>
  </div>

  <main class="app">
    <header>
      <div>
        <h1>배드민턴 대진표</h1>
        <p class="sub" id="statusText">대회 데이터를 불러오는 중입니다.</p>
      </div>
      <div class="tools">
        <button class="icon-btn" id="reloadBtn" type="button" title="새로고침" aria-label="새로고침">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg>
        </button>
        <button class="icon-btn" id="logoutBtn" type="button" title="로그아웃" aria-label="로그아웃">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M10 17l5-5-5-5"/><path d="M15 12H3"/><path d="M21 3v18"/></svg>
        </button>
      </div>
    </header>

    <div class="chips">
      <div class="chip"><b id="playerCount">0</b><span>선수</span></div>
      <div class="chip"><b id="matchCount">0</b><span>경기</span></div>
      <div class="chip"><b id="roundCount">0</b><span>라운드</span></div>
      <div class="chip"><b id="completeCount">0</b><span>결과</span></div>
    </div>

    <div class="tabs">
      <button class="tab active" data-view="scheduleView" type="button">대진</button>
      <button class="tab" data-view="playersView" type="button">선수기록</button>
      <button class="tab" data-view="rankingView" type="button">대회기록</button>
    </div>

    <section class="view active" id="scheduleView">
      <div id="scheduleOutput" class="empty">대진 데이터를 기다리고 있습니다.</div>
    </section>

    <section class="view" id="playersView">
      <div id="playersOutput" class="empty">선수별 데이터를 기다리고 있습니다.</div>
    </section>

    <section class="view" id="rankingView">
      <div id="rankingOutput" class="empty">개인순위 데이터를 기다리고 있습니다.</div>
    </section>
  </main>

  <script>
    const state = { players: [], schedule: [], results: {}, updatedAt: "" };
    const el = id => document.getElementById(id);
    let supabaseClient = null;
    let realtimeChannel = null;

    function config() {
      const globalConfig = window.BADMINTON_SUPABASE || {};
      return {
        url: globalConfig.url || "",
        anonKey: globalConfig.anonKey || "",
        eventId: sessionStorage.getItem("badminton_mobile_event_id") || globalConfig.eventId || "main"
      };
    }

    async function client() {
      const cfg = config();
      if (!cfg.url || !cfg.anonKey) throw new Error("Supabase 설정이 비어 있습니다.");
      if (!supabaseClient) {
        const { createClient } = await import("https://esm.sh/@supabase/supabase-js@2");
        supabaseClient = createClient(cfg.url, cfg.anonKey);
      }
      return supabaseClient;
    }

    async function loadEvents() {
      try {
        const sb = await client();
        const { data, error } = await sb
          .from("badminton_events")
          .select("id, data, updated_at")
          .order("updated_at", { ascending: false });
        if (error) throw error;
        const events = (data || []).filter(row => row.data?.ended !== true && row.data?.viewerPassword);
        el("eventSelect").innerHTML = events.length
          ? events.map(row => `<option value="${row.id}">${row.data?.eventId || row.id}</option>`).join("")
          : `<option value="">진행 중인 대회가 없습니다</option>`;
      } catch (error) {
        el("eventSelect").innerHTML = `<option value="">대회 목록 불러오기 실패</option>`;
        el("loginError").textContent = error.message;
      }
    }

    async function fetchEvent(eventId) {
      const sb = await client();
      const { data, error } = await sb
        .from("badminton_events")
        .select("data, updated_at")
        .eq("id", eventId)
        .single();
      if (error) throw new Error("대회 데이터를 찾을 수 없습니다.");
      return { ...data.data, updatedAt: data.data?.updatedAt || data.updated_at };
    }

    async function login(event) {
      event.preventDefault();
      const eventId = el("eventSelect").value;
      const password = el("password").value.trim();
      if (!eventId || !password) {
        el("loginError").textContent = "대회와 비밀번호를 입력하세요.";
        return;
      }
      try {
        const data = await fetchEvent(eventId);
        if (data.ended) throw new Error("종료된 대회입니다.");
        if (password !== data.viewerPassword) throw new Error("비밀번호가 맞지 않습니다.");
        sessionStorage.setItem("badminton_mobile_ok", "1");
        sessionStorage.setItem("badminton_mobile_event_id", eventId);
        sessionStorage.setItem("badminton_mobile_password", password);
        document.body.classList.remove("locked");
        applyData(data);
        subscribe();
      } catch (error) {
        el("loginError").textContent = error.message;
      }
    }

    function resultText(result) {
      if (result === "A") return "A팀 승";
      if (result === "B") return "B팀 승";
      return "미입력";
    }

    function applyData(data) {
      if (data.ended) {
        logout();
        return;
      }
      state.players = Array.isArray(data.players) ? data.players : [];
      state.schedule = Array.isArray(data.schedule) ? data.schedule : [];
      state.results = data.results || {};
      state.updatedAt = data.updatedAt || "";
      renderAll();
    }

    function statsForPlayers() {
      const stats = new Map(state.players.map(name => [name, {
        name, games: 0, wins: 0, losses: 0, pending: 0, partners: new Map(), matches: []
      }]));
      for (const match of state.schedule) {
        const result = state.results[match.id] || "";
        const teams = [
          { code: "A", label: "A팀", players: match.teamA, opponents: match.teamB },
          { code: "B", label: "B팀", players: match.teamB, opponents: match.teamA }
        ];
        for (const team of teams) {
          const status = !result ? "미진행" : result === team.code ? "승" : "패";
          for (const player of team.players) {
            if (!stats.has(player)) {
              stats.set(player, { name: player, games: 0, wins: 0, losses: 0, pending: 0, partners: new Map(), matches: [] });
            }
            const partner = team.players.find(name => name !== player) || "";
            const row = stats.get(player);
            row.games++;
            if (status === "승") row.wins++;
            if (status === "패") row.losses++;
            if (status === "미진행") row.pending++;
            row.partners.set(partner, (row.partners.get(partner) || 0) + 1);
            row.matches.push({
              id: match.id,
              round: match.round,
              court: match.court,
              partner,
              opponents: team.opponents.join(" / "),
              status
            });
          }
        }
      }
      return [...stats.values()].sort((a, b) => a.name.localeCompare(b.name, "ko-KR"));
    }

    function restGaps(matches) {
      if (matches.length <= 1) return ["첫 출전만 있음"];
      return matches.slice(1).map((match, index) => {
        const prev = matches[index];
        return prev.id + "->" + match.id + "경기 사이 " + (match.id - prev.id - 1) + "게임 쉼";
      });
    }

    function partnerDetailLines(row) {
      const grouped = new Map();
      for (const match of row.matches) {
        if (!grouped.has(match.partner)) grouped.set(match.partner, []);
        grouped.get(match.partner).push(match);
      }
      const rows = [...grouped.entries()].sort((a, b) => b[1].length - a[1].length || a[0].localeCompare(b[0], "ko-KR"));
      return rows.length ? rows.map(([partner, matches]) => {
        const details = matches.map(match => match.opponents + " - " + match.status).join(", ");
        return partner + "(" + matches.length + "회) : " + details;
      }) : ["파트너 기록 없음"];
    }

    function renderStats() {
      el("playerCount").textContent = state.players.length;
      el("matchCount").textContent = state.schedule.length;
      el("roundCount").textContent = state.schedule.length ? Math.max(...state.schedule.map(m => m.round)) : 0;
      el("completeCount").textContent = Object.values(state.results).filter(Boolean).length;
      const updated = state.updatedAt ? new Date(state.updatedAt).toLocaleString("ko-KR") : "기록 없음";
      el("statusText").textContent = "마지막 업데이트: " + updated;
    }

    function renderSchedule() {
      if (!state.schedule.length) {
        el("scheduleOutput").className = "empty";
        el("scheduleOutput").textContent = "대진 데이터가 아직 없습니다.";
        return;
      }
      el("scheduleOutput").className = "match-list";
      el("scheduleOutput").innerHTML = state.schedule.map(match => {
        const result = state.results[match.id] || "";
        return '<article class="match-card">' +
          '<div class="match-head"><span>' + match.id + '경기 · ' + match.round + 'R · ' + match.court + '코트</span></div>' +
          '<div class="teams">' +
          '<div class="team-row ' + (result === "A" ? "win-a" : "") + '"><div class="team-label">A팀</div><div class="names">' + match.teamA[0] + ' / ' + match.teamA[1] + '</div><div>' + (result === "A" ? '<span class="win-mark a">승</span>' : '') + '</div></div>' +
          '<div class="team-row ' + (result === "B" ? "win-b" : "") + '"><div class="team-label">B팀</div><div class="names">' + match.teamB[0] + ' / ' + match.teamB[1] + '</div><div>' + (result === "B" ? '<span class="win-mark b">승</span>' : '') + '</div></div>' +
          '</div></article>';
      }).join("");
    }

    function playerCard(row) {
      return '<article class="player-card">' +
        '<div class="player-head">' +
        '<div class="player-name">' + row.name + '</div>' +
        '<div class="player-record">' + row.games + '경기/' + row.wins + '승/' + row.losses + '패/' + row.pending + '미진행</div>' +
        '</div>' +
        '<div class="player-block partner">' +
        '<div class="player-block-title">* 파트너별 기록</div>' +
        '<ul class="line-list">' + partnerDetailLines(row).map(line => '<li>' + line + '</li>').join("") + '</ul>' +
        '</div>' +
        '<div class="player-block rest">' +
        '<div class="player-block-title">* 게임한 휴식텀</div>' +
        '<ul class="line-list">' + restGaps(row.matches).map(line => '<li>' + line + '</li>').join("") + '</ul>' +
        '</div>' +
        '</article>';
    }

    function renderPlayers(stats) {
      if (!stats.length) {
        el("playersOutput").className = "empty";
        el("playersOutput").textContent = "선수 데이터가 아직 없습니다.";
        return;
      }
      el("playersOutput").className = "player-list";
      el("playersOutput").innerHTML = stats.map(playerCard).join("");
    }

    function renderRanking(stats) {
      if (!stats.length) {
        el("rankingOutput").className = "empty";
        el("rankingOutput").textContent = "개인순위 데이터가 아직 없습니다.";
        return;
      }
      const ranked = [...stats].sort((a, b) =>
        b.wins - a.wins ||
        a.losses - b.losses ||
        b.games - a.games ||
        b.partners.size - a.partners.size ||
        a.name.localeCompare(b.name, "ko-KR")
      );
      el("rankingOutput").className = "rank-list";
      el("rankingOutput").innerHTML = ranked.map((row, index) => {
        const winRate = row.games ? Math.round((row.wins / row.games) * 100) : 0;
        return '<div class="rank-row top-' + (index + 1) + '">' +
          '<div class="rank-no">' + (index + 1) + '</div>' +
          '<div class="rank-main">' +
          '<span class="rank-name">' + row.name + '</span>' +
          '<span class="rank-sub">' + row.games + '경기 · ' + row.wins + '승 · ' + row.losses + '패 · ' + winRate + '% · 파트너 ' + row.partners.size + '</span>' +
          '</div>' +
          '</div>';
      }).join("");
    }

    function renderAll() {
      const stats = statsForPlayers();
      renderStats();
      renderSchedule();
      renderPlayers(stats);
      renderRanking(stats);
    }

    async function loadData() {
      const eventId = sessionStorage.getItem("badminton_mobile_event_id");
      if (!eventId) return;
      try {
        const data = await fetchEvent(eventId);
        const password = sessionStorage.getItem("badminton_mobile_password") || "";
        if (data.viewerPassword !== password) throw new Error("비밀번호가 변경되었습니다.");
        applyData(data);
      } catch (error) {
        logout();
      }
    }

    async function subscribe() {
      const eventId = sessionStorage.getItem("badminton_mobile_event_id");
      if (!eventId) return;
      const sb = await client();
      if (realtimeChannel) sb.removeChannel(realtimeChannel);
      realtimeChannel = sb.channel(`badminton-mobile-${eventId}`)
        .on("postgres_changes", { event: "*", schema: "public", table: "badminton_events", filter: `id=eq.${eventId}` }, payload => {
          if (payload.new?.data) applyData({ ...payload.new.data, updatedAt: payload.new.data?.updatedAt || payload.new.updated_at });
          if (payload.eventType === "DELETE") logout();
        })
        .subscribe();
    }

    function logout() {
      sessionStorage.removeItem("badminton_mobile_ok");
      sessionStorage.removeItem("badminton_mobile_password");
      document.body.classList.add("locked");
      el("password").value = "";
      loadEvents();
    }

    document.querySelectorAll(".tab").forEach(tab => {
      tab.addEventListener("click", () => {
        document.querySelectorAll(".tab").forEach(item => item.classList.remove("active"));
        document.querySelectorAll(".view").forEach(view => view.classList.remove("active"));
        tab.classList.add("active");
        el(tab.dataset.view).classList.add("active");
      });
    });
    el("loginForm").addEventListener("submit", login);
    el("reloadBtn").addEventListener("click", loadData);
    el("logoutBtn").addEventListener("click", logout);

    if (sessionStorage.getItem("badminton_mobile_ok") === "1") {
      document.body.classList.remove("locked");
      loadData();
      subscribe();
    } else {
      loadEvents();
    }
  </script>
</body>
</html>
